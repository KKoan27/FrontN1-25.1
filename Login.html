<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Login.css">
    <title>Pexe-Login</title>
</head>

<body>

    <header>
        <figure>
            <img height="120" src="Logo.png" alt="">
        </figure>
        <nav>
            <ul>

                <li><a href="index.html">Home</a></li>
                <li><a href="">Login</a></li>
                <li><a href="">Content</a></li>

            </ul>

        </nav>
    </header>

    <main>
        <section>
            <!--  Form para capturar as informações e o "p" fora para trazer uma resposta -->
            <h1>FAÇA O SEU LOGIN !!</h1>
            <article>
                <form id="formulario" onsubmit="Cadastrar(event)">

                    <label for="Nome"> Nome de usuario</label>
                    <br>
                    <input type="text" id="Nome" name="nome">
                    <br>
                    <label for="Email"> Email</label>
                    <br>
                    <input type="email" id="Email" name="email">
                    <br>
                    <label for="Senha"> Senha</label>
                    <br>
                    <input type="password" id="Senha" name="senha">

                    <input type="submit">
                </form>
                <p id="resposta"></p>
            </article>

        </section>
    </main>


    <footer>
        <ul>
            <li>Trabalhe conosco</li>
            <li>Termos e Privacidade</li>
            <li>Trabalho tarefa para OVIDIO</li>
        </ul>
        <ul>
            <li>PEXE CORPORATIONS</li>
            <li>Duvida e Suporte</li>
            <li>Acessibilidade</li>
        </ul>
    </footer>

    <script src="script.js"></script>
</body>

</html>
